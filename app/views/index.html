{% extends "layouts/main.html" %}

{% set pageName="Apply for a community garden plot" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">

    <h1 class="govuk-heading-xl">Get a plot in your local community garden</h1>

    <p class="govuk-body">Use this service to apply for a plot in a community garden run by your council.</p>

    <p class="govuk-body">It takes around 5 minutes.</p>

    <a href="/where-do-you-live" role="button" draggable="false" class="govuk-button govuk-button--start" data-module="govuk-button">
      Start now
      <svg class="govuk-button__start-icon" xmlns="http://www.w3.org/2000/svg" width="17.5" height="19" viewBox="0 0 33 40" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M0 0h13l20 20-20 20H0l20-20z" />
      </svg>
    </a>

  </div>
</div>

{% endblock %}
